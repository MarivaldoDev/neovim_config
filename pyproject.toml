[tool.pyright]
venvPath = "."
venv = "venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportOptionalMemberAccess = false

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
select = ["E", "F", "W"]

[tool.mypy]
warn_unused_configs = true
warn_unused_ignores = true

